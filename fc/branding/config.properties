# brrMusic visual identity is applied only inside the signed APK build workspace.
# Keep package name, signing certificate, account/storage IDs and internal APIs unchanged.
# Increase brandingRevision whenever visible branding or identity assets change.
enabled=true
brandingRevision=3
# One-release touch-elasticity trial. CI changes this to false after a signed
# APK has been verified, before committing release metadata to main.
# Future upstream updates will not re-apply the experimental patch.
oneReleaseElastic=true
